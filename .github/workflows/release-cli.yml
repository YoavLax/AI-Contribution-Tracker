name: Build & Publish ai-track CLI

# Bun can cross-compile every target from a single runner, so one job produces
# all platform binaries. On a version tag they are attached to a GitHub Release,
# which the install scripts and `ai-track update` download from.
on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub-hosted runner. Only needs to work on the public YoavLax mirror,
    # which is where binaries/releases are distributed from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CLI deps
        working-directory: packages/cli
        run: bun install

      - name: Type-check
        working-directory: packages/cli
        run: bun run typecheck

      - name: Run tests
        working-directory: packages/cli
        run: bun test

      - name: Cross-compile all binaries
        working-directory: packages/cli
        run: bun run scripts/build-binaries.ts

      - name: Generate checksums
        run: |
          cd bin
          sha256sum ai-track-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/ai-track-*
            bin/SHA256SUMS
